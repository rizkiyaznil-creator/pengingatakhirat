<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0e5b61" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Dawam" />
    <meta name="description" content="Pengingat ibadah & pencatat amal harian Muslim. Jaga amal, rawat istiqamah." />
    <title>Dawam — Pengingat Ibadah</title>
    <script>
      // Set tema sedini mungkin agar tidak ada kedip saat memuat
      try {
        var raw = localStorage.getItem('niyatin-store-v1')
        var theme = raw ? JSON.parse(raw).state.theme : 'system'
        var dark =
          theme === 'dark' ||
          ((theme === 'system' || !theme) &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
